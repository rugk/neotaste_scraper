name: Daily Export and GitHub Pages Update

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run export script
        run: |
          mkdir -p output/de output/en
          python main.py --all --lang de --html output/de/index.html --html-include-footer-navigation --json output/de/index.json
          python main.py --all --lang de --special --html output/de/special-only.html --html-include-footer-navigation --json output/de/special-only.json
          python main.py --all --lang en --html output/en/index.html --html-include-footer-navigation --json output/en/index.json
          python main.py --all --lang en --special --html output/en/special-only.html --html-include-footer-navigation --json output/en/special-only.json
          # create a language-aware static redirect at the site root
          cp templates/root_redirect.html output/index.html

      # smoke test with count verification
      - name: Verify JSON export contains results and meets count requirement
        run: |
          set -e
          echo "=== Checking DE index.json (should have > 15 items) ==="
          python scripts/verify_json.py output/de/index.json 15 || (echo "::error::DE index.json must have at least 15 entries"; exit 1)
          
          echo ""
          echo "=== Checking EN index.json (should have > 15 items) ==="
          python scripts/verify_json.py output/en/index.json 15 || (echo "::error::EN index.json must have at least 15 entries"; exit 1)

      - name: Verify JSON special-only export contains results
        continue-on-error: true
        run: |
          set -e
          echo "=== Checking DE special-only.json ==="
          python scripts/verify_json.py output/de/special-only.json 1 || echo "::warning::DE special-only.json is below minimum"
          
          echo ""
          echo "=== Checking EN special-only.json ==="
          python scripts/verify_json.py output/en/special-only.json 1 || echo "::warning::EN special-only.json is below minimum"

      - name: Upload site files
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'output'
        if: always()
  
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-upload
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: ${{ github.ref != 'refs/heads/main' }}
